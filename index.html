<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zaina Parveen Photo App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; background:#0e0e10; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

  #header {
    position:fixed; top:0; left:0; right:0; height:56px;
    background:#1c1c1f; display:flex; align-items:center; justify-content:space-between;
    padding:0 12px; z-index:50; box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  #header .title { color:#fff; font-size:17px; font-weight:600; }
  #addBtn {
    background:#3b82f6; color:#fff; border:none; padding:9px 16px; border-radius:20px;
    font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  #delBtn {
    background:#ef4444; color:#fff; border:none; padding:9px 14px; border-radius:20px;
    font-size:14px; font-weight:600; display:none; align-items:center; gap:6px; cursor:pointer;
  }
  #selCount { color:#aaa; font-size:13px; margin-right:8px; display:none; }
  #rightControls { display:flex; align-items:center; }

  #gridWrap {
    position:absolute; top:56px; left:0; right:0; bottom:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:#0e0e10; touch-action:pan-y;
  }
  #grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px 2px 40px 2px;
  }
  .cell {
    position:relative; aspect-ratio:1/1; background:#1a1a1c; overflow:hidden; cursor:pointer;
  }
  .cell img {
    width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;
  }
  .checkmark {
    position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    border:2px solid #fff; background:rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .12s; pointer-events:none;
  }
  .cell.selected .checkmark { opacity:1; background:#3b82f6; border-color:#3b82f6; }
  .cell.selected { outline:2px solid #3b82f6; outline-offset:-2px; }
  .cell.selected img { opacity:.85; }
  .checkmark svg { width:14px; height:14px; display:none; }
  .cell.selected .checkmark svg { display:block; }

  #empty {
    position:absolute; top:56px; left:0; right:0; bottom:0;
    display:none; align-items:center; justify-content:center; color:#666; font-size:14px; flex-direction:column; gap:10px;
  }

  .spinner {
    width:32px; height:32px; border:3px solid rgba(255,255,255,.25); border-top-color:#fff;
    border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #fileInput { display:none; }

  #confirmOverlay {
    position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:100;
  }
  #confirmBox {
    background:#1e1e21; border-radius:14px; padding:20px; width:80%; max-width:300px; text-align:center;
  }
  #confirmBox p { color:#eee; font-size:15px; margin-bottom:16px; }
  #confirmBox .row { display:flex; gap:10px; }
  #confirmBox button {
    flex:1; padding:10px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
  }
  #cancelDel { background:#3a3a3d; color:#fff; }
  #okDel { background:#ef4444; color:#fff; }

  /* Lightbox Styles with Pinch Zoom & Loading */
  #lightboxOverlay {
    position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:100; overflow:hidden;
  }
  #lightboxHeader {
    position:absolute; top:0; left:0; right:0; height:56px;
    display:flex; align-items:center; justify-content:space-between; padding:0 16px; z-index:101;
  }
  #lbClose, #lbDownload {
    background:rgba(255,255,255,.2); color:#fff; border:none; padding:8px 14px;
    border-radius:20px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  #imgContainer {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    overflow:hidden; touch-action:none; position:relative;
  }
  #lightboxImg {
    max-width:95%; max-height:85vh; border-radius:4px; object-fit:contain;
    transition:transform .05s ease-out; transform-origin:center center; display:none;
  }
  #lbLoading {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#aaa; font-size:14px; gap:10px; position:absolute;
  }
</style>
</head>
<body>

<div id="header">
  <div class="title">Zaina Parveen</div>
  <div id="rightControls">
    <span id="selCount">0</span>
    <button id="delBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="16" height="16"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>
      Delete
    </button>
    <button id="addBtn" style="margin-left:8px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
      Add Photo
    </button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple>

<div id="gridWrap">
  <div id="grid"></div>
  <div id="empty">
    <div class="spinner" id="initSpinner"></div>
    <div id="emptyText" style="display:none;">No photos yet</div>
  </div>
</div>

<div id="confirmOverlay">
  <div id="confirmBox">
    <p id="confirmText">Delete selected photos?</p>
    <div class="row">
      <button id="cancelDel">Cancel</button>
      <button id="okDel">Delete</button>
    </div>
  </div>
</div>

<div id="lightboxOverlay">
  <div id="lightboxHeader">
    <button id="lbClose">Close</button>
    <button id="lbDownload">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Download
    </button>
  </div>
  <div id="imgContainer">
    <div id="lbLoading">
      <div class="spinner"></div>
      <span>Photo Loading...</span>
    </div>
    <img id="lightboxImg" src="" alt="Preview">
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA0rirztMO13FyXcKYz1aEB1ERYH-HQUbA",
  authDomain: "sweethouse-e3e49.firebaseapp.com",
  databaseURL: "https://sweethouse-e3e49-default-rtdb.firebaseio.com",
  projectId: "sweethouse-e3e49",
  storageBucket: "sweethouse-e3e49.firebasestorage.app",
  messagingSenderId: "579322038108",
  appId: "1:579322038108:web:166b7fdb103080f56d6399"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const photosRef = db.ref('zaina_photos');

const grid = document.getElementById('grid');
const gridWrap = document.getElementById('gridWrap');
const emptyEl = document.getElementById('empty');
const initSpinner = document.getElementById('initSpinner');
const emptyText = document.getElementById('emptyText');
const fileInput = document.getElementById('fileInput');
const addBtn = document.getElementById('addBtn');
const delBtn = document.getElementById('delBtn');
const selCount = document.getElementById('selCount');
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmText = document.getElementById('confirmText');
const cancelDel = document.getElementById('cancelDel');
const okDel = document.getElementById('okDel');
const lightboxOverlay = document.getElementById('lightboxOverlay');
const lightboxImg = document.getElementById('lightboxImg');
const lbLoading = document.getElementById('lbLoading');
const imgContainer = document.getElementById('imgContainer');
const lbClose = document.getElementById('lbClose');
const lbDownload = document.getElementById('lbDownload');

let photos = {};
let selected = new Set();
let isDragSelecting = false;
let dragInitialState = true;
let longPressTimer = null;
let startY = 0;
let currentLightboxUrl = '';

function getFormattedDateTime(timestamp) {
  const date = new Date(timestamp);
  return date.toLocaleString('en-US', { 
    day: '2-digit', month: 'short', year: 'numeric', 
    hour: '2-digit', minute: '2-digit', hour12: true 
  });
}

function updateHeaderState() {
  const n = selected.size;
  if (n > 0) {
    delBtn.style.display = 'flex';
    selCount.style.display = 'inline';
    selCount.textContent = n;
  } else {
    delBtn.style.display = 'none';
    selCount.style.display = 'none';
  }
}

function render() {
  const list = Object.entries(photos).sort((a,b) => {
    return new Date(b[1].order).getTime() - new Date(a[1].order).getTime();
  });
  
  if (list.length === 0) {
    emptyEl.style.display = 'flex';
    initSpinner.style.display = 'none';
    emptyText.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
  }

  grid.innerHTML = '';
  for (const [id, p] of list) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (selected.has(id) ? ' selected' : '');
    cell.dataset.id = id;

    const img = document.createElement('img');
    img.src = p.url;
    img.loading = 'lazy';
    cell.appendChild(img);

    const check = document.createElement('div');
    check.className = 'checkmark';
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>';
    cell.appendChild(check);

    grid.appendChild(cell);
  }
}

// Mobile Back Button Event Handling
function openLightbox(url) {
  currentLightboxUrl = url;
  lightboxImg.style.display = 'none';
  lbLoading.style.display = 'flex';
  lightboxOverlay.style.display = 'flex';
  
  resetZoom();
  lightboxImg.src = url;

  lightboxImg.onload = () => {
    lbLoading.style.display = 'none';
    lightboxImg.style.display = 'block';
  };

  history.pushState({ lightboxOpen: true }, '', '#lightbox');
}

function closeLightbox() {
  if (lightboxOverlay.style.display === 'flex') {
    lightboxOverlay.style.display = 'none';
    if (window.location.hash === '#lightbox') {
      history.back();
    }
  }
}

window.addEventListener('popstate', () => {
  if (lightboxOverlay.style.display === 'flex') {
    lightboxOverlay.style.display = 'none';
  }
});

lbClose.addEventListener('click', closeLightbox);

// Drag & Reverse Unselect Logic
function toggleCellAtPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  if (el) {
    const cell = el.closest('.cell');
    if (cell && cell.dataset.id) {
      const id = cell.dataset.id;
      if (dragInitialState) {
        if (!selected.has(id)) {
          selected.add(id);
          cell.classList.add('selected');
          updateHeaderState();
        }
      } else {
        if (selected.has(id)) {
          selected.delete(id);
          cell.classList.remove('selected');
          updateHeaderState();
        }
      }
    }
  }
}

gridWrap.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  startY = touch.clientY;
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const cell = el ? el.closest('.cell') : null;

  if (cell && cell.dataset.id) {
    longPressTimer = setTimeout(() => {
      isDragSelecting = true;
      const id = cell.dataset.id;
      dragInitialState = !selected.has(id);
      
      if (dragInitialState) {
        selected.add(id);
        cell.classList.add('selected');
      } else {
        selected.delete(id);
        cell.classList.remove('selected');
      }
      
      if (navigator.vibrate) navigator.vibrate(40);
      updateHeaderState();
    }, 350);
  }
}, {passive: true});

gridWrap.addEventListener('touchmove', (e) => {
  const touch = e.touches[0];
  if (isDragSelecting) {
    if (e.cancelable) e.preventDefault();
    toggleCellAtPoint(touch.clientX, touch.clientY);
  } else {
    if (Math.abs(touch.clientY - startY) > 8) {
      clearTimeout(longPressTimer);
    }
  }
}, {passive: false});

gridWrap.addEventListener('touchend', () => {
  clearTimeout(longPressTimer);
  isDragSelecting = false;
});

gridWrap.addEventListener('click', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell || !cell.dataset.id) return;
  const id = cell.dataset.id;

  if (selected.size > 0) {
    if (selected.has(id)) selected.delete(id);
    else selected.add(id);
    updateHeaderState();
    render();
  } else if (photos[id]) {
    openLightbox(photos[id].url);
  }
});

// Advanced Zoom & Pan Logic (Pinch Zoom Support)
let scale = 1, pointX = 0, pointY = 0, startTouchX = 0, startTouchY = 0, lastDist = 0, isPanning = false;

function updateTransform() {
  lightboxImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
}

function resetZoom() {
  scale = 1; pointX = 0; pointY = 0;
  updateTransform();
}

imgContainer.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    startTouchX = e.touches[0].clientX - pointX;
    startTouchY = e.touches[0].clientY - pointY;
    isPanning = true;
  } else if (e.touches.length === 2) {
    isPanning = false;
    lastDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});

imgContainer.addEventListener('touchmove', (e) => {
  if (isPanning && e.touches.length === 1 && scale > 1) {
    pointX = e.touches[0].clientX - startTouchX;
    pointY = e.touches[0].clientY - startTouchY;
    updateTransform();
  } else if (e.touches.length === 2) {
    let dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    let factor = dist / lastDist;
    scale = Math.min(Math.max(scale * factor, 1), 4);
    lastDist = dist;
    updateTransform();
  }
});

imgContainer.addEventListener('touchend', () => { isPanning = false; });

// Download Logic
lbDownload.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!currentLightboxUrl) return;
  const a = document.createElement('a');
  a.href = currentLightboxUrl;
  a.download = `Photo_${Date.now()}.jpg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

addBtn.addEventListener('click', () => fileInput.click());

function compressImage(file, maxWidth = 800, quality = 0.6) {
  return new Promise((resolve) => {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => {
      let width = img.width, height = img.height;
      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => resolve(blob || file), 'image/jpeg', quality);
    };
    img.onerror = () => resolve(file);
  });
}

function makeTempCell(id) {
  const tempCell = document.createElement('div');
  tempCell.className = 'cell uploading';
  tempCell.dataset.id = id;
  const spin = document.createElement('div');
  spin.className = 'spinner';
  spin.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);';
  tempCell.appendChild(spin);
  return tempCell;
}

function uploadOne(file, id, timeFormatted, tempCell) {
  return new Promise(async (resolve) => {
    try {
      const compressedBlob = await compressImage(file);
      const reader = new FileReader();
      reader.onload = async (e) => {
        await photosRef.child(id).set({ url: e.target.result, order: timeFormatted });
        resolve(true);
      };
      reader.readAsDataURL(compressedBlob);
    } catch (err) { resolve(false); }
  });
}

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  fileInput.value = '';
  if (!files.length) return;
  emptyEl.style.display = 'none';
  const now = Date.now();
  files.forEach((file, i) => {
    const formattedOrder = getFormattedDateTime(now + (i * 1000));
    const id = photosRef.push().key;
    const tempCell = makeTempCell(id);
    grid.prepend(tempCell);
    uploadOne(file, id, formattedOrder, tempCell);
  });
});

delBtn.addEventListener('click', () => {
  if (selected.size === 0) return;
  confirmText.textContent = selected.size + ' photo(s) delete karein?';
  confirmOverlay.style.display = 'flex';
});

cancelDel.addEventListener('click', () => confirmOverlay.style.display = 'none');

okDel.addEventListener('click', async () => {
  confirmOverlay.style.display = 'none';
  const ids = Array.from(selected);
  for (const id of ids) {
    try { await photosRef.child(id).remove(); } catch (err) {}
    selected.delete(id);
  }
  updateHeaderState();
});

// App Start Loading Handler
emptyEl.style.display = 'flex';
initSpinner.style.display = 'block';

photosRef.on('value', (snap) => {
  photos = snap.val() || {};
  for (const id of Array.from(selected)) {
    if (!photos[id]) selected.delete(id);
  }
  updateHeaderState();
  render();
});
</script>
</body>
</html>
