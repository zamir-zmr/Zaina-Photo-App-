  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; background:#0f0a12; font-family:'Poppins', sans-serif; overflow:hidden; }

  /* Background Floating Sparkles Pattern */
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255, 105, 180, 0.12), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(244, 114, 182, 0.1), transparent 40%);
    pointer-events: none; z-index: 0;
  }

  /* Header Design */
  #header {
    position:fixed; top:0; left:0; right:0; height:64px;
    background: transparent;
    box-shadow: none;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; z-index:50;
    border-bottom: none;
    will-change: transform;
    overflow: visible;
  }
  #header .title-area { display: flex; align-items: center; gap: 8px; position: relative; z-index: 2; }
  #header .title {
    color:#ffb6c1; font-family: 'Sacramento', cursive; font-size:28px; font-weight:700;
    text-shadow: 0 0 10px rgba(255, 182, 193, 0.4);
    animation: pulseTitle 3s infinite ease-in-out;
  }
  #rightControls { position: relative; z-index: 2; }
  #addBtn { position: relative; z-index: 1; }

  /* HOME SCREEN BUTTERFLY LAYER — a single full-viewport-fixed field that runs from
     just above the header down through the entire home screen. It is NOT clipped at
     the header boundary: butterflies simply pass behind the header's own background
     as they cross it, then continue flying straight into the home screen below,
     so they never disappear or get cut off — always several airborne.
     LANES: the 20 butterflies (10 header + 10 home) are each locked to their own
     5vh-tall horizontal lane spanning the full screen height, alternating between
     the two fields, so their vertical ranges never overlap and they can't touch —
     each also has its own flutter (wing-flap + bob) timing so none of them are in sync. */
  .home-butterfly-field {
    position: fixed; inset: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 5;
    transform: translateZ(0);
    will-change: transform;
    isolation: isolate;
    contain: layout style;
  }
  .home-flying-butterfly {
    position: fixed;
    left: 0%; top: 0%;
    transform-origin: center center;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-play-state: running !important;
    will-change: transform;
    backface-visibility: hidden;
    transform: translateZ(0);
  }
  .home-flying-butterfly .bob {
    width: 100%; height: 100%;
  }

  /* MULTI-BUTTERFLY FIELD — 10 more butterflies, each in its own lane (interleaved

  /* SMALL TOP BUTTERFLY (kept for empty-state icon reuse) */
  .top-flower {

  .butterfly-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    perspective: 220px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)) drop-shadow(0 0 12px rgba(255,140,180,0.4)) saturate(1.25) contrast(1.08);
  }
  .wing {
    transform-box: fill-box;
    transform-style: preserve-3d;
    backface-visibility: visible;
  }
  .wing path {
    stroke: rgba(20, 6, 14, 0.4);
    stroke-width: 0.7;
    stroke-linejoin: round;
    paint-order: fill;
  }
  .wing-left {
    transform-origin: right center;
    animation: flapLeft3D 0.42s infinite cubic-bezier(0.45, 0, 0.4, 1);
  }
  .wing-right {
    transform-origin: left center;
    animation: flapRight3D 0.42s infinite cubic-bezier(0.45, 0, 0.4, 1);
  }
  /* Real wings don't just shrink — they fold up in 3D like a book closing,
     fast on the downbeat and easing gently back open */
  @keyframes flapLeft3D {
    0%   { transform: rotateY(0deg) rotateZ(2deg) scaleY(1); }
    38%  { transform: rotateY(78deg) rotateZ(6deg) scaleY(0.96); }
    50%  { transform: rotateY(92deg) rotateZ(8deg) scaleY(0.94); }
    65%  { transform: rotateY(55deg) rotateZ(4deg) scaleY(0.97); }
    100% { transform: rotateY(0deg) rotateZ(2deg) scaleY(1); }
  }
  @keyframes flapRight3D {

    38%  { transform: rotateY(-78deg) rotateZ(-6deg) scaleY(0.96); }
    50%  { transform: rotateY(-92deg) rotateZ(-8deg) scaleY(0.94); }
    65%  { transform: rotateY(-55deg) rotateZ(-4deg) scaleY(0.97); }

  /* Photo Cards */

    transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.2s;
    animation: popUp 0.3s ease-out;
    contain: layout style paint;
    content-visibility: auto;
    contain-intrinsic-size: 0 120px;
    transform: translateZ(0);

  .cell:hover { transform: scale(1.03) translateZ(0); border-color: rgba(255, 182, 193, 0.4); will-change: transform; }

  .cell img {
    width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;

  /* Heart Checkmark Selection */

  }

  /* Selected Cell with Bounce Animation */
  .cell.selected {

    animation: selectionBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .cell.selected .checkmark { opacity:1; background:#ff758c; border-color:#ff758c; transform: scale(1.1); }
  .cell.selected .checkmark svg { display:block; }
  .cell.selected img { filter: brightness(0.85); }

  @keyframes selectionBounce {

  .lb-thumb {
  flex-shrink: 0;
  width: 56px;
  height: 56px;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;

  transition:
    transform 0.25s cubic-bezier(0.25, 1, 0.5, 1),
    border-color 0.25s ease,
    opacity 0.25s ease,
    width 0.25s cubic-bezier(0.25, 1, 0.5, 1),
    height 0.25s cubic-bezier(0.25, 1, 0.5, 1);

  /* ALL THUMBNAILS FULL CLEAR */
  opacity: 1;

  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  position: relative;
}

.lb-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;

  /* IMAGE FULL CLEAR */
  opacity: 1;
  filter: none;
}

.lb-thumb.active {
  width: 68px;
  height: 68px;

  /* ACTIVE PHOTO BORDER */
  border-color: #ff758c;

  /* ACTIVE ALSO FULL CLEAR */
  opacity: 1;

  box-shadow:
    0 0 16px rgba(255, 117, 140, 0.7),
    0 4px 12px rgba(0,0,0,0.6);

  transform: scale(1);
}

/* NON-ACTIVE THUMBNAILS ALSO STAY CLEAR */
.lb-thumb:not(.active) {
  opacity: 1;
  filter: none;
}

/* HOVER */
.lb-thumb:not(.active):hover {
  opacity: 1;
  transform: scale(1.06);
}

  @media (max-width: 400px) {
    #lbThumbnailStrip { height: 80px; }
    .lb-thumb { width: 48px; height: 48px; }
    .lb-thumb.active { width: 60px; height: 60px; }
  }

/* IndexedDB Cache — 500MB+, localStorage se 100x bada */
const IDB_NAME = 'ZainaGallery';
const IDB_STORE = 'photos';
const IDB_VERSION = 1;
let idb = null;

function openIDB() {
  return new Promise((resolve, reject) => {
    if (idb) { resolve(idb); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { idb = e.target.result; resolve(idb); };
    req.onerror = () => reject(req.error);
  });
}

async function loadCachedPhotos() {
  try {
    const db = await openIDB();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const req = store.getAll();
      req.onsuccess = () => {
        const rows = req.result;
        if (rows && rows.length > 0) {
          photos = {};
          rows.forEach(r => { photos[r.id] = { url: r.url, order: r.order }; });
          resolve(true);
        } else {
          resolve(false);
        }
      };
      req.onerror = () => resolve(false);
    });
  } catch(e) { return false; }
}

async function saveCachedPhotos(data) {
  try {
    const db = await openIDB();
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const store = tx.objectStore(IDB_STORE);
    // Clear old, write new
    store.clear();
    Object.entries(data).forEach(([id, p]) => {
      store.put({ id, url: p.url, order: p.order });
    });
  } catch(e) { console.warn('IDB save error', e); }
}

async function removeFromCache(id) {
  try {
    const db = await openIDB();
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
  } catch(e) {}
}

async function addToCache(id, p) {
  try {
    const db = await openIDB();
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({ id, url: p.url, order: p.order });
  } catch(e) {}
}

      if (src) {
        img.src = src;
        img.removeAttribute('data-src');

      imgObserver.unobserve(img);

function render() {
  const list = Object.entries(photos).sort((a,b) =>
    new Date(b[1].order).getTime() - new Date(a[1].order).getTime()

  if (list.length === 0) {
    emptyEl.style.display = 'flex';
    initSpinner.style.display = 'none';
    emptyText.style.display = 'flex';
    grid.innerHTML = '';
    return;
  }
  emptyEl.style.display = 'none';
  initSpinner.style.display = 'none';

  // Diff: only add new, remove deleted
  const existingIds = new Set([...grid.querySelectorAll('.cell[data-id]')].map(c => c.dataset.id));
  const newIds = new Set(list.map(([id]) => id));

  existingIds.forEach(id => {
    if (!newIds.has(id)) {
      const el = grid.querySelector(`.cell[data-id="${id}"]`);
      if (el) el.remove();
    }
  });

  const frag = document.createDocumentFragment();
  list.forEach(([id, p]) => {
    if (!existingIds.has(id)) frag.appendChild(makeCell(id, p));
  });
  if (frag.childNodes.length > 0) grid.prepend(frag);

  // Re-order DOM to match sorted list
  list.forEach(([id], i) => {
    const el = grid.querySelector(`.cell[data-id="${id}"]`);
    if (el && grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
  });
}

function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        function resizeTo(src, maxPx) {
          let w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
          if (w > h) { if (w > maxPx) { h = Math.round(h * maxPx / w); w = maxPx; } }
          else { if (h > maxPx) { w = Math.round(w * maxPx / h); h = maxPx; } }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(src, 0, 0, w, h);
          return c;
        }
        let c = resizeTo(img, 800);
        let out = c.toDataURL('image/jpeg', 0.65);
        if (out.length > 130 * 1024) out = c.toDataURL('image/jpeg', 0.45);
        if (out.length > 100 * 1024) { c = resizeTo(img, 600); out = c.toDataURL('image/jpeg', 0.5); }
        if (out.length > 80 * 1024)  { c = resizeTo(img, 480); out = c.toDataURL('image/jpeg', 0.45); }
        resolve(out);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let currentPhotoList = [];

function updateNavButtons() {

/* ---- Thumbnail Strip ---- */
/*
 * LOCKED ACTIVE THUMBNAIL BEHAVIOR
 * --------------------------------
 * The currently displayed photo is ALWAYS represented by the first
 * visible thumbnail in the strip. Its border stays visible.
 *
 * We do not move the active thumbnail to the middle anymore. Instead,
 * syncThumbnails() rebuilds the visible window so currentIndex becomes
 * position 0, while the remaining thumbnails follow it.
 */
const THUMB_VISIBLE = 5; // active + following thumbnails

function buildThumbnailStrip() {
  lbThumbTrack.innerHTML = '';

  currentPhotoList.forEach((photo, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'lb-thumb';
    thumb.dataset.idx = i;

    const img = document.createElement('img');
    img.src = photo.url;
    img.alt = '';
    img.draggable = false;

    thumb.appendChild(img);

    thumb.addEventListener('click', (e) => {
      e.stopPropagation();

      const idx = parseInt(thumb.dataset.idx, 10);
      if (!Number.isFinite(idx) || idx === currentIndex) return;

      // Grid/thumbnail selection becomes the new active photo immediately.
      currentIndex = idx;

      const p = currentPhotoList[currentIndex];
      if (!p) return;

      currentLightboxUrl = p.url;
      scale = 1;
      pointX = 0;
      pointY = 0;

      lightboxImg.style.display = 'block';
      lightboxImg.src = p.url;

      updateAdjacentImages();
      setTrackTransition(false);
      positionTrack(0);
      updateNavButtons();

      // IMPORTANT: move the selected thumbnail to the far-left position
      // immediately and keep its active border.
      syncThumbnails(true);
    });

    lbThumbTrack.appendChild(thumb);
  });

  // Initial lightbox open: selected photo is also locked to far-left.
  syncThumbnails(true);
}

function syncThumbnails(animate = true) {
  const total = currentPhotoList.length;
  const thumbs = Array.from(lbThumbTrack.querySelectorAll('.lb-thumb'));

  if (!total || !thumbs.length || currentIndex < 0) {
    lbThumbTrack.style.transition = 'none';
    lbThumbTrack.style.transform = 'translateX(0)';
    return;
  }

  /*
   * The thumbnail DOM order stays stable, but the visible window is
   * rebuilt around currentIndex by translating the track.
   *
   * Because the active thumbnail is 68px while normal thumbnails are
   * 56px, calculate the exact distance using the actual element widths.
   * This prevents the active item from being slightly off the left edge.
   */
  thumbs.forEach((t, i) => {
    t.classList.toggle('active', i === currentIndex);
  });

  // Put the current thumbnail at the far-left edge.
  // Measure the width of every item before currentIndex so the offset
  // remains correct even when the active thumbnail has a different size.
  let offset = 0;
  for (let i = 0; i < currentIndex; i++) {
    const rect = thumbs[i].getBoundingClientRect();
    offset += rect.width + 6; // thumbnail width + gap
  }

  /*
   * When moving backward, the active thumbnail must also become the
   * first visible item. translateX() therefore uses the complete
   * accumulated width of all thumbnails before currentIndex.
   */
  lbThumbTrack.style.transition = animate
    ? 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)'
    : 'none';
  lbThumbTrack.style.transform = `translateX(${-offset}px)`;

  /*
   * Keep the active thumbnail visually pinned at the far-left position.
   * The extra timeout handles the active thumbnail's width transition.
   */
  if (animate) {
    setTimeout(() => {
      if (currentIndex < 0) return;

      const currentThumb = lbThumbTrack.querySelector(
        `.lb-thumb[data-idx="${currentIndex}"]`
      );

      if (!currentThumb) return;

      let exactOffset = 0;
      thumbs.forEach((t, i) => {
        if (i < currentIndex) {
          exactOffset += t.offsetWidth + 6;
        }
      });

      lbThumbTrack.style.transform = `translateX(${-exactOffset}px)`;
    }, 260);
  }
}
/* ---- End Thumbnail Strip ---- */

function getContainerWidth() {
  containerWidth = imgContainer.clientWidth || window.innerWidth;
  return containerWidth;
}

function setImgSrc(el, url) {
  if (url) {
    if (el.src !== url) el.src = url;
    el.style.visibility = 'visible';
  } else {
    el.removeAttribute('src');
    el.style.visibility = 'hidden';
  }
}

/* Preload the neighbouring photos so the swipe never shows a blank/loading frame */
function updateAdjacentImages() {
  const prevPhoto = currentPhotoList[currentIndex - 1];
  const nextPhoto = currentPhotoList[currentIndex + 1];
  setImgSrc(lbImgPrev, prevPhoto ? prevPhoto.url : '');
  setImgSrc(lbImgNext, nextPhoto ? nextPhoto.url : '');
}

function setTrackTransition(on) {
  const t = on ? 'transform 0.26s cubic-bezier(0.25,1,0.5,1)' : 'none';
  lbImgPrev.style.transition = t;
  lightboxImg.style.transition = t;
  lbImgNext.style.transition = t;
}

/* Positions all three images together as one strip: prev stuck on the left edge,
   next stuck on the right edge of the current photo, so dragging reveals the
   next photo sliding in attached — no fade, no blink. */
function positionTrack(dragPx) {
  const w = containerWidth || getContainerWidth();
  lbImgPrev.style.transform = `translate(-50%,-50%) translate3d(${-w + dragPx}px, 0, 0)`;
  lightboxImg.style.transform = `translate(-50%,-50%) translate3d(${dragPx + pointX}px, ${pointY}px, 0) scale(${scale})`;
  lbImgNext.style.transform = `translate(-50%,-50%) translate3d(${w + dragPx}px, 0, 0)`;
}

function loadLightboxPhoto(index, instant) {
  if (!currentPhotoList[index]) return;
  currentIndex = index;
  const photo = currentPhotoList[index];
  currentLightboxUrl = photo.url;
  scale = 1; pointX = 0; pointY = 0;
  getContainerWidth();

  if (instant) {
    lbLoading.style.display = 'flex';
    lightboxImg.style.display = 'none';
    lightboxImg.onload = () => {
      lbLoading.style.display = 'none';
      lightboxImg.style.display = 'block';
    };
    lightboxImg.src = photo.url;
  } else {
    lightboxImg.style.display = 'block';
    lightboxImg.src = photo.url;
  }

  updateAdjacentImages();
  setTrackTransition(false);
  positionTrack(0);
  updateNavButtons();
}

/* Slides the whole strip fully over to the neighbouring photo, then swaps the
   loaded src into the (already-cached) main image — visually seamless. */
function completeSlide(direction) {
  const targetIndex = currentIndex + direction;
  if (!currentPhotoList[targetIndex]) { bounceEdge(direction); return; }
  getContainerWidth();
  setTrackTransition(true);
  positionTrack(direction === 1 ? -containerWidth : containerWidth);
  setTimeout(() => {
    currentIndex = targetIndex;
    const photo = currentPhotoList[currentIndex];
    currentLightboxUrl = photo.url;
    scale = 1; pointX = 0; pointY = 0;
    setTrackTransition(false);
    lightboxImg.src = photo.url;
    updateAdjacentImages();
    positionTrack(0);
    updateNavButtons();

    // New photo is now displayed: immediately lock its thumbnail
    // to the far-left position with the active border.
    syncThumbnails(true);
  }, 260);
}

function bounceEdge(direction) {
  setTrackTransition(true);
  positionTrack(direction === 1 ? -22 : 22);
  setTimeout(() => {
    setTrackTransition(true);
    positionTrack(0);
  }, 150);
}

function goToNext() {
  if (currentIndex < currentPhotoList.length - 1) {
    completeSlide(1);
  } else {
    bounceEdge(1);
  }
}

function goToPrev() {
  if (currentIndex > 0) {
    completeSlide(-1);
  } else {
    bounceEdge(-1);
  }
}

function openLightbox(id) {
  buildPhotoList();
  const idx = currentPhotoList.findIndex(p => p.id === id);
  currentIndex = idx >= 0 ? idx : 0;
  lightboxOverlay.style.display = 'flex';
  loadLightboxPhoto(currentIndex, true);
  buildThumbnailStrip();

}

}

/* SMOOTH ZOOM & PANNING WITH BOUNDARIES */
let scale = 1, pointX = 0, pointY = 0;
let startTouchX = 0, startTouchY = 0, lastDist = 0;
let isPanning = false;
let lastTapTime = 0;
let swipeTracking = false;
let swipeStartX = 0, swipeStartY = 0;

function clampBoundaries() {
  const containerRect = imgContainer.getBoundingClientRect();
  if (scale <= 1) {
    pointX = 0;
    pointY = 0;
    return;
  }
  const renderedWidth = lightboxImg.offsetWidth * scale;
  const renderedHeight = lightboxImg.offsetHeight * scale;
  const maxTransX = Math.max(0, (renderedWidth - containerRect.width) / 2);
  const maxTransY = Math.max(0, (renderedHeight - containerRect.height) / 2);

  pointX = Math.min(Math.max(pointX, -maxTransX), maxTransX);
  pointY = Math.min(Math.max(pointY, -maxTransY), maxTransY);
}

function updateTransform(smooth = false) {
  clampBoundaries();
  lightboxImg.style.transition = smooth ? 'transform 0.2s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
  lightboxImg.style.transform = `translate(-50%,-50%) translate3d(${pointX}px, ${pointY}px, 0px) scale(${scale})`;
}

function resetZoom() {
  scale = 1; pointX = 0; pointY = 0;
  updateTransform(true);
}

imgContainer.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTapTime;
    if (tapLength < 300 && tapLength > 0) {
      if (scale > 1) {
        resetZoom();
      } else {
        scale = 2.5;
        updateTransform(true);
      }
      e.preventDefault();
      swipeTracking = false;
      return;
    }
    lastTapTime = currentTime;

    if (scale > 1) {
      isPanning = true;
      swipeTracking = false;
      startTouchX = e.touches[0].clientX - pointX;
      startTouchY = e.touches[0].clientY - pointY;
    } else {
      swipeTracking = true;
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
    }
  } else if (e.touches.length === 2) {
    isPanning = false;
    swipeTracking = false;
    lastDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});

imgContainer.addEventListener('touchmove', (e) => {
  if (isPanning && e.touches.length === 1 && scale > 1) {
    pointX = e.touches[0].clientX - startTouchX;
    pointY = e.touches[0].clientY - startTouchY;
    updateTransform(false);
  } else if (swipeTracking && e.touches.length === 1 && scale <= 1) {
    const dx = e.touches[0].clientX - swipeStartX;
    const dy = e.touches[0].clientY - swipeStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (e.cancelable) e.preventDefault();
      setTrackTransition(false);
      positionTrack(dx);
    }
  } else if (e.touches.length === 2) {
    let dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    let factor = dist / lastDist;
    scale = Math.min(Math.max(scale * factor, 1), 4);
    lastDist = dist;
    updateTransform(false);
  }
});

imgContainer.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) {
    isPanning = false;
    if (swipeTracking) {
      swipeTracking = false;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - swipeStartX;
      const dy = touch.clientY - swipeStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) goToNext(); else goToPrev();
      } else {
        setTrackTransition(true);
        positionTrack(0);
      }
      return;
    }
    if (scale < 1) {
      resetZoom();
    } else {
      updateTransform(true);
    }
  }
});

imgContainer.addEventListener('touchcancel', () => {
  isPanning = false;
  if (swipeTracking) {
    swipeTracking = false;
    setTrackTransition(true);
    positionTrack(0);
  }
});

/* Mouse drag swipe support (desktop) */
let mouseSwipeActive = false;

imgContainer.addEventListener('mousedown', (e) => {
  if (scale <= 1) {
    mouseSwipeActive = true;
    swipeStartX = e.clientX;
    swipeStartY = e.clientY;
    e.preventDefault();
  }
});

imgContainer.addEventListener('mousemove', (e) => {
  if (mouseSwipeActive) {
    const dx = e.clientX - swipeStartX;
    const dy = e.clientY - swipeStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      setTrackTransition(false);
      positionTrack(dx);
    }
  }
});

function endMouseSwipe(e) {
  if (!mouseSwipeActive) return;
  mouseSwipeActive = false;
  const dx = e.clientX - swipeStartX;
  const dy = e.clientY - swipeStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) goToNext(); else goToPrev();
  } else {
    setTrackTransition(true);
    positionTrack(0);
  }
}

imgContainer.addEventListener('mouseup', endMouseSwipe);
imgContainer.addEventListener('mouseleave', (e) => {
  if (mouseSwipeActive) endMouseSwipe(e);
});

  function uploadOne(file, id, timeFormatted, tempCell) {
  return new Promise(async (resolve) => {
    try {
      const compressedDataUrl = await compressImage(file);
      const photoData = { url: compressedDataUrl, order: timeFormatted };
      await photosRef.child(id).set(photoData);
      // Immediately cache — child_added will also fire but no harm
      photos[id] = photoData;
      await addToCache(id, photoData);
      resolve(true);
    } catch (err) { resolve(false); }
  });
}

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  fileInput.value = '';
  if (!files.length) return;
  emptyEl.style.display = 'none';
  const now = Date.now();
  files.forEach((file, i) => {
    const formattedOrder = getFormattedDateTime(now + (i * 1000));
    const id = photosRef.push().key;
    const tempCell = makeTempCell(id);
    grid.prepend(tempCell);
    uploadOne(file, id, formattedOrder, tempCell);
  });
});

delBtn.addEventListener('click', () => {
  if (selected.size === 0) return;
  confirmText.textContent = selected.size + ' photo(s) delete karein?';
  confirmOverlay.style.display = 'flex';
});

cancelDel.addEventListener('click', () => confirmOverlay.style.display = 'none');

cancelSelBtn.addEventListener('click', () => {
  selected.forEach(id => {
    const cell = grid.querySelector(`.cell[data-id="${id}"]`);
    if (cell) cell.classList.remove('selected');
  });
  selected.clear();
  updateHeaderState();
});

okDel.addEventListener('click', async () => {
  confirmOverlay.style.display = 'none';
  const ids = Array.from(selected);
  for (const id of ids) {
    try {
      await photosRef.child(id).remove();
      delete photos[id];
      await removeFromCache(id);
      const el = grid.querySelector(`.cell[data-id="${id}"]`);
      if (el) el.remove();
    } catch (err) {}
    selected.delete(id);
  }
  updateHeaderState();
  if (Object.keys(photos).length === 0) {
    emptyEl.style.display = 'flex';
    initSpinner.style.display = 'none';
    emptyText.style.display = 'flex';
  }
});

/* App Init — IndexedDB async */
(async () => {
  const hasCache = await loadCachedPhotos();

  if (hasCache && Object.keys(photos).length > 0) {
    emptyEl.style.display = 'none';
    render();
  } else {
    emptyEl.style.display = 'flex';
    initSpinner.style.display = 'flex';
    animateProgress(progressBarFill, progressText, () => {});
  }

  // Pehle once() — saara data ek baar lo
  photosRef.once('value', async (snap) => {
    const data = snap.val() || {};
    photos = data;
    await saveCachedPhotos(photos);
    for (const id of Array.from(selected)) {
      if (!photos[id]) selected.delete(id);
    }
    updateHeaderState();
    if (Object.keys(photos).length === 0) {
      emptyEl.style.display = 'flex';
      initSpinner.style.display = 'none';
      emptyText.style.display = 'flex';
      grid.innerHTML = '';
    } else {
      render();
    }

    // Phir sirf changes sun — child_added & child_removed
    photosRef.on('child_added', async (snap) => {
      const id = snap.key;
      if (photos[id]) return; // already have it
      photos[id] = snap.val();
      await addToCache(id, photos[id]);
      render();
    });

    photosRef.on('child_removed', async (snap) => {
      const id = snap.key;
      delete photos[id];
      await removeFromCache(id);
      selected.delete(id);
      const el = grid.querySelector(`.cell[data-id="${id}"]`);
      if (el) el.remove();
      updateHeaderState();
    });
  });
})();
</script>
